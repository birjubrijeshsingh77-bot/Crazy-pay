<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrazyPay - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #052e16, #0f5132, #14532d);
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #4ade80;
    }
    .logout-btn {
      background: #ef4444;
      border: none;
      padding: 8px 14px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .balance-card {
      text-align: center;
      padding: 30px 20px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .balance-title {
      font-size: 14px;
      color: #cbd5e1;
      text-transform: uppercase;
    }
    .balance-amount {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      margin: 10px 0;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .action-btn {
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: #000;
      transition: 0.3s;
    }
    .btn-deposit {
      background: #22c55e;
    }
    .btn-deposit:hover {
      background: #4ade80;
    }
    .btn-withdraw {
      background: #eab308;
    }
    .btn-withdraw:hover {
      background: #fde047;
    }
    .tx-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: #4ade80;
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }
    .tx-type {
      font-weight: 600;
    }
    .tx-amount {
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand">CrazyPay</div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Balance Card -->
    <div class="glass-card balance-card">
      <div class="balance-title">Wallet Balance</div>
      <div class="balance-amount">₹<span id="user-balance">0.00</span></div>
      <div>
        User: <strong id="user-phone">...</strong> | 
        KYC: <span id="kyc-badge" class="status-badge">Pending</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="action-btn btn-deposit" onclick="alert('Deposit processing...')">Deposit</button>
      <button class="action-btn btn-withdraw" onclick="alert('Withdraw processing...')">Withdraw</button>
    </div>

    <!-- Recent Transactions -->
    <div class="glass-card">
      <div class="tx-title">Recent Transactions</div>
      <div id="tx-list">Loading...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://fxzvuqibqkrvdgzeyduq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_c8Hk0984tTqxOJsn_N4ZFQ_T4fAGPLD";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const userPhone = localStorage.getItem('user_phone');

    if (!userPhone) {
      window.location.href = 'index.html';
    } else {
      document.getElementById('user-phone').innerText = userPhone;
      loadUserData();
      loadTransactions();
    }

    async function loadUserData() {
      const { data, error } = await supabase
        .from('users')
        .select('wallet_balance, kyc_status')
        .eq('phone', userPhone)
        .single();

      if (data) {
        document.getElementById('user-balance').innerText = data.wallet_balance || '0.00';
        document.getElementById('kyc-badge').innerText = data.kyc_status || 'Pending';
      }
    }

    async function loadTransactions() {
      const { data, error } = await supabase
        .from('transaction')
        .select('*')
        .eq('phone', userPhone)
        .order('created_at', { ascending: false });

      const txList = document.getElementById('tx-list');
      if (data && data.length > 0) {
        txList.innerHTML = data.map(tx => `
          <div class="tx-item">
            <div>
              <div class="tx-type">${tx.type}</div>
              <small style="color:#aaa">${new Date(tx.created_at).toLocaleDateString()}</small>
            </div>
            <div style="text-align:right">
              <div class="tx-amount">₹${tx.amount}</div>
              <small style="color:${tx.status === 'Approved' ? '#4ade80' : tx.status === 'Rejected' ? '#ef4444' : '#eab308'}">${tx.status}</small>
            </div>
          </div>
        `).join('');
      } else {
        txList.innerHTML = '<div style="color:#aaa; text-align:center">No transactions yet</div>';
      }
    }

    function logout() {
      localStorage.removeItem('user_phone');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
