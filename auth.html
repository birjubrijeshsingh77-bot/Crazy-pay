<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrazyPay - Auth</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #052e16; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.1); border: 1px solid #22c55e; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; color: #fff; }
    .title { text-align: center; font-size: 24px; font-weight: bold; color: #4ade80; margin-bottom: 20px; }
    .section { font-size: 14px; font-weight: bold; color: #22c55e; margin-top: 15px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #ccc; }
    .input-group input { width: 100%; padding: 10px; background: #14532d; border: 1px solid #22c55e; border-radius: 6px; color: #fff; outline: none; }
    .btn { width: 100%; padding: 10px; background: #22c55e; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .divider { text-align: center; margin: 15px 0; color: #888; font-size: 12px; }
    .msg { margin-top: 15px; text-align: center; font-size: 13px; font-weight: bold; min-height: 18px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">CrazyPay</div>

    <!-- REGISTER -->
    <div class="section">1. Register</div>
    <div class="input-group">
      <label>Mobile Number</label>
      <input type="text" id="reg-phone" placeholder="Enter Mobile">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="reg-pass" placeholder="Create Password">
    </div>
    <button class="btn" onclick="doRegister()">REGISTER</button>

    <div class="divider">────── OR ──────</div>

    <!-- LOGIN -->
    <div class="section">2. Login</div>
    <div class="input-group">
      <label>Mobile Number</label>
      <input type="text" id="log-phone" placeholder="Enter Mobile">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="log-pass" placeholder="Enter Password">
    </div>
    <button class="btn" onclick="doLogin()">LOGIN</button>

    <div id="status-msg" class="msg"></div>
  </div>

  <script>
    const client = supabase.createClient(
      "https://fxzvuqibqkrvdgzeyduq.supabase.co",
      "sb_publishable_c8Hk0984tTqxOJsn_N4ZFQ_T4fAGPLD"
    );

    async function doRegister() {
      const p = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      const msg = document.getElementById('status-msg');

      if (!p || !pass) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Number and Password required!';
        return;
      }

      msg.style.color = '#ffcc00';
      msg.innerText = 'Registering...';

      const { data: existing } = await client.from('users').select('phone').eq('phone', p).maybeSingle();
      if (existing) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Already registered! Login below.';
        return;
      }

      const { error } = await client.from('users').insert([{
        phone: p,
        password: pass,
        wallet_balance: 0,
        kyc_status: 'Pending'
      }]);

      if (error) {
        msg.style.color = '#ff4d4d';
        msg.innerText = error.message;
      } else {
        msg.style.color = '#4ade80';
        msg.innerText = 'Success! Now login below.';
      }
    }

    async function doLogin() {
      const p = document.getElementById('log-phone').value.trim();
      const pass = document.getElementById('log-pass').value.trim();
      const msg = document.getElementById('status-msg');

      if (!p || !pass) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Enter Number & Password!';
        return;
      }

      msg.style.color = '#ffcc00';
      msg.innerText = 'Logging in...';

      const { data, error } = await client
        .from('users')
        .select('*')
        .eq('phone', p)
        .eq('password', pass)
        .maybeSingle();

      if (error || !data) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Invalid details!';
      } else {
        msg.style.color = '#4ade80';
        msg.innerText = 'Login Successful! Redirecting...';
        localStorage.setItem('user_phone', data.phone);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }
    }
  </script>
</body>
</html>
