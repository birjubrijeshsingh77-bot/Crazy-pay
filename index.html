<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrazyPay - Auth</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #052e16;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .box {
      background: #0f5132;
      border: 1px solid #22c55e;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      color: #fff;
    }
    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #4ade80;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #22c55e;
      margin-top: 15px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      background: #14532d;
      border: 1px solid #22c55e;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 11px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
    }
    .divider {
      text-align: center;
      margin: 20px 0 10px 0;
      color: #aaa;
      font-size: 13px;
    }
    .msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="title">CRAZYPAY</div>

    <!-- REGISTER SECTION -->
    <div class="section-title">New User? Register Here</div>
    <div class="input-group">
      <label>Mobile Number</label>
      <input type="text" id="reg-phone" placeholder="Enter Mobile Number">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Create Password">
    </div>
    <div class="input-group">
      <label>Invite Code (Optional)</label>
      <input type="text" id="reg-invite" placeholder="Enter Invite Code">
    </div>
    <button class="btn" onclick="doRegister()">REGISTER ACCOUNT</button>

    <div class="divider">──────── OR ────────</div>

    <!-- LOGIN SECTION -->
    <div class="section-title">Already Registered? Login</div>
    <div class="input-group">
      <label>Mobile Number</label>
      <input type="text" id="login-phone" placeholder="Enter Mobile Number">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter Password">
    </div>
    <button class="btn" onclick="doLogin()">LOGIN NOW</button>

    <div id="status-msg" class="msg"></div>
  </div>

  <script>
    const client = supabase.createClient(
      "https://fxzvuqibqkrvdgzeyduq.supabase.co",
      "sb_publishable_c8Hk0984tTqxOJsn_N4ZFQ_T4fAGPLD"
    );

    async function doRegister() {
      const p = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-password').value.trim();
      const inv = document.getElementById('reg-invite').value.trim();
      const msg = document.getElementById('status-msg');

      if (!p || !pass) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Please enter Mobile Number and Password for Register!';
        return;
      }

      msg.style.color = '#ffcc00';
      msg.innerText = 'Registering...';

      const { data: existing } = await client.from('users').select('phone').eq('phone', p).maybeSingle();
      if (existing) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Mobile number is ALREADY registered!';
        return;
      }

      const { error } = await client.from('users').insert([{
        phone: p,
        password: pass,
        invite_code: inv,
        wallet_balance: 0,
        kyc_status: 'Pending'
      }]);

      if (error) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Error: ' + error.message;
      } else {
        msg.style.color = '#4ade80';
        msg.innerText = 'Registration SUCCESSFUL! Now scroll down & Login.';
      }
    }

    async function doLogin() {
      const p = document.getElementById('login-phone').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      const msg = document.getElementById('status-msg');

      if (!p || !pass) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Please enter Mobile Number and Password for Login!';
        return;
      }

      msg.style.color = '#ffcc00';
      msg.innerText = 'Logging in...';

      const { data, error } = await client
        .from('users')
        .select('*')
        .eq('phone', p)
        .eq('password', pass)
        .maybeSingle();

      if (error || !data) {
        msg.style.color = '#ff4d4d';
        msg.innerText = 'Invalid Mobile Number or Password!';
      } else {
        msg.style.color = '#4ade80';
        msg.innerText = 'Login Successful! Redirecting...';
        localStorage.setItem('user_phone', data.phone);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }
    }
  </script>
</body>
</html>
